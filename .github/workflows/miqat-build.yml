name: Miqat Android 15 APK
on:
  workflow_dispatch:
    inputs:
      emulator_tests:
        description: Run Android 15 emulator tests
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'Miqat-Reminder-v0.3.0-PUBLIC-SOURCE.zip'
      - '.github/workflows/miqat-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate and extract public source
        shell: bash
        run: |
          set -euo pipefail
          test -f Miqat-Reminder-v0.3.0-PUBLIC-SOURCE.zip
          unzip -Z1 Miqat-Reminder-v0.3.0-PUBLIC-SOURCE.zip | grep -q '^MiqatReminder/app/build.gradle.kts$'
          if unzip -Z1 Miqat-Reminder-v0.3.0-PUBLIC-SOURCE.zip | grep -Ei '(\.keystore$|\.jks$|\.p12$|\.pfx$|signing/|local\.properties$|\.env$)'; then
            echo 'ERROR: private files in public source archive' >&2
            exit 1
          fi
          unzip -q Miqat-Reminder-v0.3.0-PUBLIC-SOURCE.zip -d .
          chmod +x MiqatReminder/gradlew
      - name: Install Android 15 SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build APK, unit tests and lint
        working-directory: MiqatReminder
        run: bash gradlew --no-daemon --stacktrace :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:assembleDebugAndroidTest
      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs MiqatReminder/app/build/outputs/apk/debug/app-debug.apk
          echo '### APK build (new debug signature)' >> "$GITHUB_STEP_SUMMARY"
          echo 'This APK installs fresh, but cannot update an older installation signed with a different key.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Miqat-v0.3.0-Android15-DEBUG
          path: MiqatReminder/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Miqat-build-diagnostics
          path: |
            MiqatReminder/app/build/reports/
            MiqatReminder/app/build/test-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Android 15 emulator tests
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.emulator_tests }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: cd MiqatReminder && bash gradlew --no-daemon :app:connectedDebugAndroidTest
